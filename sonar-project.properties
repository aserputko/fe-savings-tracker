sonar.projectKey=aserputko_fe-savings-tracker
sonar.organization=aserputko

sonar.projectName=fe-savings-tracker
sonar.projectVersion=1.0

# Source & test layout
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.stories.ts,**/*.stories.tsx

# Files to skip entirely (generated code, static assets, bootstrap, build output)
sonar.exclusions=src/api/generated/**,src/assets/**,src/main.tsx,coverage/**,dist/**,storybook-static/**

# Files to include in analysis but exclude from coverage measurement
sonar.coverage.exclusions=src/api/generated/**,src/**/*.stories.{ts,tsx},src/test/**,src/main.tsx

# Coverage report generated by `npm run test:coverage` (Vitest v8 provider, lcov reporter)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.app.json

sonar.sourceEncoding=UTF-8
